<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'DM Sans',system-ui,sans-serif;
    background:var(--bg);color:var(--txt);
    min-height:100vh;display:flex;justify-content:center;
    padding:56px 18px 40px;
  }
  .page{width:100%;max-width:580px;text-align:center;position:relative}

  .share{
    position:fixed;top:14px;inset-inline-end:14px;
    width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.55);color:var(--txt);font-size:16px;
    backdrop-filter:blur(6px);
  }
  .avatar{
    width:96px;height:96px;border-radius:50%;margin:0 auto 14px;object-fit:cover;
    background:var(--btn);color:var(--btxt);
    display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;
  }
  img.avatar{border:2px solid var(--txt);background:#fff}
  .wordmark{display:block;width:220px;max-width:70%;height:auto;margin:8px auto 10px}
  h1{font-size:20px;font-weight:800}
  .handle{font-size:15px;opacity:.7;margin-top:2px;direction:ltr}
  .bio{font-size:15px;margin:10px auto 28px;max-width:36ch;line-height:1.6}

  .links{display:flex;flex-direction:column;gap:14px}
  .link{
    position:relative;display:flex;align-items:center;justify-content:center;
    min-height:58px;padding:12px 60px;
    font-size:16px;font-weight:700;text-decoration:none;
    background:var(--btn);color:var(--btxt);border:2px solid var(--btn);
    border-radius:var(--r);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .app{position:absolute;inset-inline-start:10px;top:50%;margin-top:-19px;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--abg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .app svg{width:21px;height:21px;fill:var(--afg)}
  .share svg{width:17px;height:17px;fill:currentColor;vertical-align:middle}
  .link:hover{transform:scale(1.02)}

  body.outline .link{background:transparent;color:var(--txt);border-color:var(--txt)}
  body.outline .link:hover{background:var(--txt);color:var(--bg)}
  body.shadow .link{border-color:var(--txt);box-shadow:4px 4px 0 var(--sh)}
  body.shadow .link:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sh)}
  body.shadow .link:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--sh)}

  .socials{display:flex;justify-content:center;gap:22px;margin-top:34px}
  .socials a{color:var(--txt);font-size:26px;transition:transform .15s}
  .socials a:hover{transform:scale(1.12)}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;
    opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.on{opacity:1}
</style>
</head>

const RADIUS = {pill:"999px", soft:"14px", square:"4px"};

const s = document.documentElement.style;
document.documentElement.dir = c.direction;
s.setProperty('--bg', c.background);
s.setProperty('--btn', c.buttonColor);
s.setProperty('--btxt', c.buttonText);
s.setProperty('--txt', c.textColor);
s.setProperty('--sh', c.shadowColor || c.textColor);
s.setProperty('--r', RADIUS[c.rounded] || RADIUS.pill);
document.body.classList.add(c.buttonStyle);
document.title = c.name;

const asset = v => (v && v[0] === '@') ? (EMBEDDED[v.slice(1)] || '') : v;
if (c.photo) $('avatar').outerHTML = `<img class="avatar" src="${asset(c.photo)}" alt="">`;
else { $('avatar').className = 'avatar'; $('avatar').textContent = c.name.trim()[0].toUpperCase(); }
if (c.wordmark) $('name').outerHTML = `<h1><img class="wordmark" src="${asset(c.wordmark)}" alt="${c.name}"></h1>`;
else $('name').textContent = c.name;
$('handle').textContent = c.handle || '';
$('bio').textContent = c.bio || '';
if (!c.bio) $('bio').style.margin = '0 0 28px';

c.links.forEach(l => {
  const a = document.createElement('a');
  a.className = 'link'; a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
  const ap = APPS[l.icon];
  if (ap) a.innerHTML = `<span class="app" style="--abg:${ap.bg};--afg:${ap.fg}"><svg viewBox="0 0 24 24"><path d="${ap.p}"/></svg></span>`;
  const t = document.createElement('span'); t.textContent = l.label; a.appendChild(t);
  $('links').appendChild(a);
});
(c.socials || []).forEach(x => {
  const ap = APPS[x.type]; if (!ap) return;
  const a = document.createElement('a');
  a.href = x.url; a.target = '_blank'; a.rel = 'noopener'; a.ariaLabel = x.type;
  a.innerHTML = `<svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="${ap.p}"/></svg>`;
  $('socials').appendChild(a);
});

$('share').onclick = async () => {
  try { if (navigator.share) return await navigator.share({title:c.name, url:location.href}); } catch(e){ return; }
  try { await navigator.clipboard.writeText(location.href); } catch(e){}
  $('toast').classList.add('on'); setTimeout(() => $('toast').classList.remove('on'), 1600);
};
</script>
